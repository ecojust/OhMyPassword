[package]
name = "ohmypassword-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encrypted local vault and convergent sync data for OhMyPassword"

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Enable round-key zeroization in aes-gcm's shared AES dependency as well.
aes = { version = "0.8", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
fs2 = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
