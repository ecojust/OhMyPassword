name: Build and verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'

jobs:
  checks:
    name: Core, service and extension
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/core -> target
            desktop/service -> target
      - name: Verify version and frontend paths
        run: python .github/scripts/verify-versions.py
      - run: npm ci
      - name: Build shared frontend and browser extension
        run: npm run build
      - name: Test browser extension
        run: npm run test:extension
      - name: Install Chromium for real extension and frontend tests
        run: npx playwright install --with-deps chromium
      - name: Test installed extension, request Origin and autofill
        run: npm run test:browser --workspace @ohmypassword/extension
      - name: Test shared desktop and mobile UI
        run: npm run test:ui --workspace @ohmypassword/desktop
      - name: Test encrypted vault
        run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - name: Test local bridge and synchronization
        run: cargo test --locked --manifest-path desktop/service/Cargo.toml
      - name: Package browser extension
        run: python .github/scripts/collect-artifacts.py extension
      - uses: actions/upload-artifact@v4
        with:
          name: ohmypassword-extension
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop-${{ matrix.target }}
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config patchelf
      - run: npm ci
      - name: Build native desktop and installer
        run: npm run tauri --workspace @ohmypassword/desktop -- build --ci --target "$BUILD_TARGET" --bundles "${{ matrix.bundle }}" -- --locked
      - name: Verify macOS DMG, complete signature and installed startup
        if: runner.os == 'macOS'
        run: python .github/scripts/verify-macos-bundle.py --target "$BUILD_TARGET"
      - name: Collect desktop artifacts
        run: python .github/scripts/collect-artifacts.py "${{ matrix.platform }}" --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: ohmypassword-desktop-${{ matrix.platform }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64 development APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
          key: android-aarch64
      - run: npm ci
      - name: Generate Android project
        run: npm run tauri --workspace @ohmypassword/mobile -- android init --ci --skip-targets-install
      - name: Apply and verify Android native settings
        run: python .github/scripts/prepare-mobile.py android
      - name: Build development-signed ARM64 APK
        run: npm run tauri --workspace @ohmypassword/mobile -- android build --ci --debug --target aarch64 --apk -- --locked
      - name: Collect and verify APK signature
        run: |
          python .github/scripts/collect-artifacts.py android
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs ci-artifacts/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ohmypassword-android-arm64-debug
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS ARM64 Simulator
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon host and Xcode tooling
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          command -v xcodegen >/dev/null || brew install xcodegen
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
          key: ios-aarch64-simulator
      - run: npm ci
      - name: Generate iOS project without an Apple account
        run: npm run tauri --workspace @ohmypassword/mobile -- ios init --ci --skip-targets-install
      - name: Verify iOS native settings
        run: python .github/scripts/prepare-mobile.py ios
      - name: Build unsigned iOS Simulator app
        run: npm run tauri --workspace @ohmypassword/mobile -- ios build --ci --debug --target aarch64-sim --no-sign -- --locked
      - name: Collect Simulator app
        run: python .github/scripts/collect-artifacts.py ios
      - uses: actions/upload-artifact@v4
        with:
          name: ohmypassword-ios-arm64-simulator
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
