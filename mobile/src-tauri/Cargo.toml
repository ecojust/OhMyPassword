[package]
name = "ohmypassword-mobile"
version = "0.2.2"
edition = "2021"
license = "MIT"

[lib]
name = "ohmypassword_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ohmypassword-desktop = { package = "ohmypassword-desktop", path = "../../desktop/src-tauri" }
# Tauri's build script reads plugin metadata only from direct dependencies.
# Keep these direct even though the shared shell initializes them.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-discovery = { path = "../plugins/discovery" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
