[package]
name = "tauri-plugin-discovery"
version = "0.2.0"
authors = ["ecojust"]
description = "Native Bonjour/NSD discovery for OhMyPassword"
edition = "2021"
license = "MIT"
links = "tauri-plugin-discovery"
[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
